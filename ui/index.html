<!doctype html>
<html
  lang="en"
  data-theme="light"
  data-surface="hybrid"
  data-accent="blue"
  data-radius="soft"
  data-density="comfortable"
  data-font="system"
  data-motion="full"
  data-borders="on"
  data-wallpaper="procedural"
  data-performance="off"
  data-glass-mode="pending"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f1ec" />
    <link rel="icon" href="/logo-small.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>__BRAND_TITLE__</title>
    <script>
      // Apply the saved design before the first paint so there is no flash.
      (function () {
        var root = document.documentElement;
        var themes = ['light', 'dark', 'frost'];
        var surfaces = ['matte', 'glass', 'hybrid'];
        var accents = ['blue', 'orange', 'cream', 'green', 'violet', 'silver', 'mono'];
        var radii = ['sharp', 'soft', 'round'];
        var densities = ['compact', 'comfortable', 'spacious'];
        var fonts = ['system', 'inter', 'mono'];
        var motions = ['full', 'reduced', 'off'];
        var wallpapers = ['procedural', 'image', 'none'];
        function pick(value, allowed, fallback) {
          return allowed.indexOf(value) >= 0 ? value : fallback;
        }
        try {
          var saved = null;
          try {
            saved = JSON.parse(localStorage.getItem('__BRAND_STORAGE_PREFIX__design') || 'null');
          } catch (error) {
            saved = null;
          }
          if (saved && typeof saved === 'object') {
            root.dataset.theme = pick(saved.theme, themes, 'light');
            root.dataset.surface = pick(saved.surface, surfaces, 'hybrid');
            root.dataset.accent = pick(saved.accent, accents, 'blue');
            root.dataset.radius = pick(saved.radius, radii, 'soft');
            root.dataset.density = pick(saved.density, densities, 'comfortable');
            root.dataset.font = pick(saved.font, fonts, 'system');
            root.dataset.motion = pick(saved.motion, motions, 'full');
            root.dataset.wallpaper = pick(saved.wallpaper, wallpapers, 'procedural');
            root.dataset.borders = saved.borders === false ? 'off' : 'on';
            root.dataset.performance = saved.performance === true ? 'on' : 'off';
          } else {
            var legacy = localStorage.getItem('__BRAND_STORAGE_PREFIX__theme');
            root.dataset.theme = themes.indexOf(legacy) >= 0 ? legacy : 'light';
          }
          var forced = new URLSearchParams(location.search).get('theme');
          if (themes.indexOf(forced) >= 0) root.dataset.theme = forced;
          root.style.colorScheme = root.dataset.theme === 'dark' ? 'dark' : 'light';
          var pattern = new URLSearchParams(location.search).get('pattern');
          if (pattern !== 'checker' && pattern !== 'smoky') {
            pattern = localStorage.getItem('__BRAND_STORAGE_PREFIX__glassPattern') === 'checker' ? 'checker' : 'smoky';
          }
          root.dataset.glassPattern = pattern;
        } catch (error) {
          root.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
