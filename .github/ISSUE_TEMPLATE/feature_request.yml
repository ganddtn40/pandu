name: Feature request
description: Propose a capability or a change in behavior.
title: 'feat: '
labels: ['enhancement', 'needs triage']
body:
  - type: markdown
    attributes:
      value: |
        Cockpit is local-first and deliberately narrow. Features that require a
        hosted service, telemetry, or a mandatory account are out of scope.
        Explain the workflow you are trying to support, not only the feature.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow and where it breaks down today.
      placeholder: When I compare two runs of the same task, I have to...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Cockpit do? Include commands, routes, or UI if you have them in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds, other tools, or a smaller change that would also help.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Recording proxy
        - Dashboard
        - CLI
        - Storage
        - Run Guard or budgets
        - Replay, snapshots, or trust
        - Context Doctor
        - Project Brain, Arena, or handoff
        - Analytics or journal
        - Plugins
        - Pairing or remote access
        - Desktop app
        - Android app
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: agents
    attributes:
      label: Which agents or providers does this affect?
      multiple: true
      options:
        - OpenCode
        - Cline
        - Aider
        - Claude Code
        - Codex
        - Cursor
        - Any OpenAI-compatible client
        - Any Anthropic-compatible client
        - All agents
        - Not agent-specific
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Design constraints
      options:
        - label: This works fully offline and needs no Cockpit-hosted service.
          required: true
        - label: This does not add telemetry or background uploads.
          required: true
        - label: I am willing to open a pull request for this.
          required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, related issues, or prior art.
    validations:
      required: false
