name: Feature request
description: Propose a change that fits Pandu's local, fail-open scope.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Pandu is a local flight recorder and control tower for AI coding agents.
        Features that require telemetry, cloud sync, TLS interception, or
        uploading user data are out of scope.

        For a large change, describe the problem before the solution. The
        roadmap and `docs/issues/` may already contain a draft.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user need, not only the implementation you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Pandu do? Include the user-visible behaviour.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or related tools.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Home, Inbox, Flights, or Settings
        - Capture (proxy, log-watch, hook/OTel)
        - Guards, budgets, or approvals
        - Remote access or Android companion
        - Market and registry
        - Models and context controls
        - Updates, backups, or packaging
        - Documentation or translations
        - Other
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This can work without telemetry, cloud sync, or TLS interception.
          required: true
        - label: I checked the roadmap and existing issues.
          required: true
