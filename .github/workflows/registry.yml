name: Registry

# The registry is a security boundary. Pull requests are checked without the
# signing key; pushes to a protected branch verify the signed index that
# Pandu actually loads. A contributor never needs the private key. The signed
# job uses a release binary because debug builds embed the test trust root.

on:
  pull_request:
    paths:
      - 'registry/**'
      - '.github/workflows/registry.yml'
  push:
    branches: [main, rewrite]
    paths:
      - 'registry/**'
      - '.github/workflows/registry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staged:
    name: Validate contributor entries
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check registry tooling syntax
        run: node --check registry/sign.mjs && node --check registry/hash.mjs

      - name: Validate loose entries, hashes, and scans
        run: |
          cargo run --locked -p pandu-cli -- market check \
            --dir registry --staged --online --links

  signed:
    name: Verify signed registry
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check registry tooling syntax
        run: node --check registry/sign.mjs && node --check registry/hash.mjs

      - name: Verify signatures, index hashes, and pinned sources
        run: |
          cargo run --release --locked -p pandu-cli -- market check \
            --dir registry --online --links

      - name: Run market registry tests
        run: cargo test --locked -p pandu-daemon --lib "market::"

  policy:
    name: Security policy files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require policy files
        run: |
          test -s SECURITY.md
          test -s docs/security.md
          test -s docs/market.md
          test -s docs/registry/CONTRIBUTING.md
          test -s docs/registry/KEYS.md
          test -s .github/CODEOWNERS
          test -s registry/schema/entry.schema.json

      - name: Reject key files in the registry
        run: |
          if find registry -type f \( -name '*.pem' -o -name '*.key' \) | grep -q .; then
            echo "A private key file was committed under registry/."
            exit 1
          fi
