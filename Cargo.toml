[workspace]
resolver = "3"
members = [
  "crates/pandu-core",
  "crates/pandu-daemon",
  "crates/pandu-cli",
]
default-members = ["crates/pandu-cli"]
exclude = ["legacy"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/ganddtn40/pandu"
homepage = "https://github.com/ganddtn40/pandu"
authors = ["Pandu contributors"]

[workspace.dependencies]
# Async runtime and HTTP
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "fs",
  "io-util",
  "sync",
  "time",
  "signal",
  "process",
] }
axum = { version = "0.8", features = ["macros", "ws"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "http2",
  "json",
  "stream",
] }
http = "1"
bytes = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
percent-encoding = "2"
regex = "1"
glob = "0.3"
semver = "1"
minisign-verify = "0.3"
blake2 = "0.10"

# Storage
rusqlite = { version = "0.41", features = ["bundled", "backup"] }

# Serialization and data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
toml = "0.8"
toml_edit = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
tar = "0.4"
flate2 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
rand = "0.8"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
rpassword = "7"

# CLI, logging, errors
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Platform paths and tests
directories = "5"
tempfile = "3"

# Embedded UI assets
rust-embed = { version = "8", features = ["include-exclude"] }

# Remote access: pairing QR, LAN TLS
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rcgen = "0.13"
axum-server = { version = "0.9", features = ["tls-rustls"] }
tokio-tungstenite = "0.26"

# The Windows PTY needs two changes upstream does not make: the child must be
# its own process group so a console control event aimed at the host cannot
# reach it, and the pseudoconsole must accept plain VT input so a single 0x03
# byte interrupts the child. See `vendor/portable-pty/README.pandu.md`.
[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package."*"]
opt-level = "z"

# cargo-dist builds the CLI with `--profile dist`. Inherit the release profile
# so the archive ships the same optimized, stripped binary as a manual
# `cargo build --release` instead of an unoptimized fallback.
[profile.dist]
inherits = "release"
