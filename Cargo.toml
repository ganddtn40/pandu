[workspace]
resolver = "3"
members = [
  "crates/cockpit-core",
  "crates/cockpit-daemon",
  "crates/cockpit-cli",
]
default-members = ["crates/cockpit-cli"]
exclude = ["legacy"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ganddtn40/cockpit"
homepage = "https://github.com/ganddtn40/cockpit"
authors = ["Cockpit contributors"]

[workspace.dependencies]
# Async runtime and HTTP
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "fs",
  "io-util",
  "sync",
  "time",
  "signal",
  "process",
] }
axum = { version = "0.8", features = ["macros", "ws"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "http2",
  "json",
  "stream",
] }
http = "1"
bytes = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
percent-encoding = "2"
regex = "1"
glob = "0.3"

# Storage
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

# Serialization and data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
rand = "0.8"

# CLI, logging, errors
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Platform paths and tests
directories = "5"
tempfile = "3"

# Embedded UI assets
rust-embed = { version = "8", features = ["include-exclude"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package."*"]
opt-level = "z"
