schema_version = 1
id = "claude-code"
name = "Claude Code"
verified = false
docs_url = "https://docs.claude.com/en/docs/claude-code/overview"
capture = ["log_watch", "hook_otel"]

[detect]
command = "claude"
version_args = ["--version"]

[log_watch]
roots = ["~/.claude/projects"]
include = ["**/*.jsonl"]
parser = "claude-code-jsonl"
verified = false

[hook_otel]
otlp_http = false
hooks = ["session_start", "tool_call", "session_end"]
verified = false

# Skills live in ~/.claude/skills (user) and .claude/skills (project).
# Checked against https://docs.claude.com/en/docs/claude-code/skills
[skills]
user_paths = ["~/.claude/skills"]
project_paths = [".claude/skills"]
verified = true

# User-scope MCP servers live in ~/.claude.json; project scope uses .mcp.json.
# Checked against https://docs.claude.com/en/docs/claude-code/mcp
# ~/.claude.json also holds Claude Code's app state, so Cockpit never edits it.
# Use the project scope (.mcp.json) or Claude's own `claude mcp add` command.
[mcp]
user_paths = ["~/.claude.json"]
project_paths = [".mcp.json"]
format = "jsonc"
style = "claude"
key_path = ["mcpServers"]
write_user_config = false
verified = true
