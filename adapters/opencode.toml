schema_version = 1
id = "opencode"
name = "OpenCode"
verified = false
docs_url = "https://opencode.ai/docs/"
capture = ["proxy", "log_watch"]

[detect]
command = "opencode"
version_args = ["--version"]

[proxy]
protocols = ["openai-chat", "anthropic"]
base_url_env = ["OPENAI_BASE_URL", "ANTHROPIC_BASE_URL"]
api_key_env = ["OPENAI_API_KEY", "ANTHROPIC_API_KEY"]
setup_note = "Point the OpenAI or Anthropic base URL at Pandu and keep a local placeholder key."
verified = false

[log_watch]
roots = ["~/.local/share/opencode/storage"]
include = ["**/*.json"]
parser = "generic-json"
verified = false

# Skills live in ~/.config/opencode/skills (user) and .opencode/skills
# (project). Checked against https://opencode.ai/docs/skills
[skills]
user_paths = ["~/.config/opencode/skills"]
project_paths = [".opencode/skills"]
verified = true

# MCP servers live under mcp.servers in opencode.json or opencode.jsonc.
# Checked against https://opencode.ai/docs/mcp-servers
[mcp]
user_paths = ["~/.config/opencode/opencode.json", "~/.config/opencode/opencode.jsonc"]
project_paths = ["opencode.json", "opencode.jsonc", ".opencode/opencode.json", ".opencode/opencode.jsonc"]
format = "jsonc"
style = "opencode"
key_path = ["mcp", "servers"]
write_user_config = true
verified = true
