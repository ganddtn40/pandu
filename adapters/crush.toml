schema_version = 1
id = "crush"
name = "Crush"
verified = false
docs_url = "https://github.com/charmbracelet/crush"
capture = ["proxy"]

[detect]
command = "crush"
version_args = ["--version"]

[proxy]
protocols = ["openai-chat", "anthropic"]
base_url_env = ["OPENAI_BASE_URL", "ANTHROPIC_BASE_URL"]
api_key_env = ["OPENAI_API_KEY", "ANTHROPIC_API_KEY"]
setup_note = "Choose an OpenAI-compatible or Anthropic provider and point it at Pandu."
verified = false
