schema_version = 1
id = "aider"
name = "Aider"
verified = false
docs_url = "https://aider.chat/docs/"
capture = ["proxy"]

[detect]
command = "aider"
version_args = ["--version"]

[proxy]
protocols = ["openai-chat", "anthropic"]
base_url_env = ["OPENAI_BASE_URL", "ANTHROPIC_BASE_URL"]
api_key_env = ["OPENAI_API_KEY", "ANTHROPIC_API_KEY"]
setup_note = "Set the OpenAI or Anthropic base URL to Pandu before starting Aider."
verified = false
