schema_version = 1
id = "roo-kilo"
name = "Roo / Kilo Code"
verified = false
docs_url = "https://docs.roocode.com/"
capture = ["proxy"]

[detect]
command = "code"
version_args = ["--version"]

[proxy]
protocols = ["openai-chat", "anthropic"]
base_url_env = ["OPENAI_BASE_URL", "ANTHROPIC_BASE_URL"]
api_key_env = ["OPENAI_API_KEY", "ANTHROPIC_API_KEY"]
setup_note = "Configure an OpenAI-compatible or Anthropic provider inside the extension and point it at Cockpit."
verified = false
