schema_version = 1
id = "cline"
name = "Cline"
verified = false
docs_url = "https://docs.cline.bot/"
capture = ["proxy"]

[detect]
command = "cline"
version_args = ["--version"]

[proxy]
protocols = ["openai-chat", "anthropic"]
base_url_env = ["OPENAI_BASE_URL", "ANTHROPIC_BASE_URL"]
api_key_env = ["OPENAI_API_KEY", "ANTHROPIC_API_KEY"]
setup_note = "Choose the OpenAI-compatible or Anthropic provider and point it at Cockpit."
verified = false
