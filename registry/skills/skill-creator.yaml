readme: |
  # Skill Creator

  Helps create a new skill, improve an existing one, and measure whether it works. The workflow covers drafting SKILL.md, writing test prompts, running evals, reviewing results, and packaging the skill.

  The skill includes Python helpers for aggregation, reporting, description improvement, and packaging. It writes eval data and reports into the workspace. It does not publish anything.

  ## Source and license

  Source: https://github.com/anthropics/skills at commit 2c5958ecac7cee2b583967a2c4981d0f4a75c579. License evidence and the pinned tree hash are recorded in the registry entry and the seed report.

  The skill folder carries its own Apache-2.0 LICENSE.txt. Pandu copies that folder into the agent skill directory and never executes the skill.
