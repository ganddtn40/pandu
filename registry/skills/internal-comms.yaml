readme: |
  # Internal Communications

  Helps write internal communications in a consistent company voice. Formats include status reports, leadership updates, 3P updates, company newsletters, FAQs, incident reports, and project updates.

  The skill includes examples for each format. It reads the project context the user points at and writes the finished draft to the workspace.

  ## Source and license

  Source: https://github.com/anthropics/skills at commit 2c5958ecac7cee2b583967a2c4981d0f4a75c579. License evidence and the pinned tree hash are recorded in the registry entry and the seed report.

  The skill folder carries its own Apache-2.0 LICENSE.txt. Pandu copies that folder into the agent skill directory and never executes the skill.
