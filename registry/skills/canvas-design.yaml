readme: |
  # Canvas Design

  Creates a single-page poster or static artwork as PDF or PNG. The skill begins with a written design philosophy, uses the bundled fonts, and produces a visual piece with a restrained palette and systematic typography.

  The skill folder includes open-licensed font files and their license texts. The generated PDF or PNG is written to the workspace; Cockpit does not render or open it.

  ## Source and license

  Source: https://github.com/anthropics/skills at commit 2c5958ecac7cee2b583967a2c4981d0f4a75c579. License evidence and the pinned tree hash are recorded in the registry entry and the seed report.

  The skill folder carries its own Apache-2.0 LICENSE.txt. The bundled fonts keep their own OFL license files. Cockpit copies the folder into the agent skill directory and never executes the skill.
