readme: |
  # Web App Testing

  Tests a local web application with Playwright. The skill starts one or more dev servers, waits for the ports, drives a browser, checks frontend behavior, captures screenshots, and reads console logs and DOM state.

  The bundled with_server.py helper manages server lifecycle. The examples show element discovery, console logging, and static HTML automation. Test scripts and screenshots are written to the workspace.

  ## Source and license

  Source: https://github.com/anthropics/skills at commit 2c5958ecac7cee2b583967a2c4981d0f4a75c579. License evidence and the pinned tree hash are recorded in the registry entry and the seed report.

  The skill folder carries its own Apache-2.0 LICENSE.txt. Pandu copies that folder into the agent skill directory and never executes the skill.
