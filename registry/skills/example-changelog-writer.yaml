readme: |
  # Changelog Writer

  **This is an example fixture.** It is hidden from production builds and is
  not a real marketplace listing.

  The skill turns a list of merged changes into short, player-facing notes.

  ## Structure

  - **Added** for new content and features.
  - **Changed** for behavior that existing players will notice.
  - **Fixed** for defects that affected players.
  - **Removed** for content or behavior that is gone.

  ## Voice

  Prefer concrete nouns and active verbs. Do not call a fix "minor" when a
  player lost progress. Leave internal tooling changes out of player notes.

  ## Safety

  The skill writes text only. It never publishes a release, tags a build, or
  posts to an external service.
