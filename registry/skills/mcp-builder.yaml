readme: |
  # MCP Builder

  A guide for building MCP servers in Python with FastMCP or in TypeScript with the MCP SDK. It covers tool naming and descriptions, input and output schemas, transport choices, error handling, evaluation, and testing.

  The skill may fetch MCP specification and SDK documentation, then run builds and tests in the project. The MCP Inspector command is documented in the skill; Cockpit does not run it during install.

  ## Source and license

  Source: https://github.com/anthropics/skills at commit 2c5958ecac7cee2b583967a2c4981d0f4a75c579. License evidence and the pinned tree hash are recorded in the registry entry and the seed report.

  The skill folder carries its own Apache-2.0 LICENSE.txt. Cockpit copies that folder into the agent skill directory and never executes the skill.
