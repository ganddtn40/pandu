readme: |
  # Frontend Design

  Guidance for making a UI feel designed rather than templated. The skill asks for a deliberate aesthetic direction, a clear typographic hierarchy, responsive behavior down to mobile, visible keyboard focus, reduced-motion support, and accessible color choices.

  It reads the existing interface, proposes a direction, and writes the revised frontend code. It does not install packages or start a server by itself.

  ## Source and license

