readme: |
  # Theme Factory

  Styles an artifact with a consistent visual theme. Ten preset themes define colors and fonts for slides, documents, reports, and HTML pages. The skill can also generate a new theme when none of the presets fit.

  The folder includes a PDF showcase and one Markdown file per theme. The skill reads the target artifact and writes the styled result.

  ## Source and license

  Source: https://github.com/anthropics/skills at commit 2c5958ecac7cee2b583967a2c4981d0f4a75c579. License evidence and the pinned tree hash are recorded in the registry entry and the seed report.

  The skill folder carries its own Apache-2.0 LICENSE.txt. Cockpit copies that folder into the agent skill directory and never executes the skill.
