readme: |
  # Brand Guidelines

  Applies Anthropic's brand colors and typography to an artifact. The skill ships a compact reference for the palette and type, then asks the agent to apply those choices consistently to the target document, slide, or interface.

  ## Source and license

  Source: https://github.com/anthropics/skills at commit 2c5958ecac7cee2b583967a2c4981d0f4a75c579. License evidence and the pinned tree hash are recorded in the registry entry and the seed report.

  The skill folder carries its own Apache-2.0 LICENSE.txt. Pandu copies that folder into the agent skill directory and never executes the skill.
