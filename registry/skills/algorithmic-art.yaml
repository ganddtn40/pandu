readme: |
  # Algorithmic Art

  Creates original generative art with p5.js. The workflow has two stages: write an algorithmic philosophy as Markdown, then express it as a seeded p5.js sketch with interactive parameters and a standalone HTML viewer.

  The generated HTML loads p5.js from a CDN. Cockpit does not open the viewer or run the sketch; the agent writes the files and the user opens them in a browser.

  ## Output

  - A Markdown file with the algorithmic philosophy.
  - An HTML viewer with the sketch and controls.
  - A JavaScript file with the generative algorithm.

  ## Source and license

  Source: https://github.com/anthropics/skills at commit 2c5958ecac7cee2b583967a2c4981d0f4a75c579. License evidence and the pinned tree hash are recorded in the registry entry and the seed report.

  The skill folder carries its own Apache-2.0 LICENSE.txt. Cockpit copies that folder into the agent skill directory and never executes the skill.
