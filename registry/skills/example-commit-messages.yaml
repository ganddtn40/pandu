readme: |
  # Commit Message Coach

  **This is an example fixture.** It is hidden from production builds and is
  not a real marketplace listing.

  The skill reads the staged diff, identifies the intent, and returns a
  Conventional Commits subject line under 72 characters with a short body that
  explains why the change exists.

  ## What it reads

  - The diff the user shares.
  - Repository style notes the user points at.

  ## What it never does

  - It does not run `git commit`, `git reset`, or any history rewrite.
  - It does not read credentials, dotfiles, or environment secrets.
  - It does not send repository content anywhere.

  ## Install notes

  Cockpit copies the files into the agent's skill folder. The agent decides
  when to load the skill; Cockpit never executes it.
