readme: |
  # Slack GIF Creator

  Creates animated GIFs for Slack. The skill provides constraints for emoji and message sizes, easing functions, frame composition, and validators for dimensions, frame count, and duration.

  The helpers use Pillow, imageio, and numpy. The skill documents installing them with pip; Pandu does not install them. The generated GIF is written to the workspace.

  ## Source and license

  Source: https://github.com/anthropics/skills at commit 2c5958ecac7cee2b583967a2c4981d0f4a75c579. License evidence and the pinned tree hash are recorded in the registry entry and the seed report.

  The skill folder carries its own Apache-2.0 LICENSE.txt. Pandu copies that folder into the agent skill directory and never executes the skill.
