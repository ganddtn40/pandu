schema_version: 1
id: "github-mcp-server"
name: "GitHub MCP Server (Docker)"
kind: "mcp"
version: "2.1.0"
short_description: "Run GitHub's MCP server locally in Docker with a personal access token for repository and workflow tools."
long_description: "Runs GitHub's MCP server locally in Docker. The container is pinned by digest and reads GITHUB_PERSONAL_ACCESS_TOKEN from the environment. It offers the same repository and workflow tools as the remote server."
categories:
  - "coding"
  - "devops"
tags:
  - "github"
  - "docker"
  - "issues"
agents:
  - "claude-code"
  - "codex"
  - "opencode"
source:
  repo: "https://github.com/github/github-mcp-server"
  commit: "4bcdcdf8d7beee98c9448e73e257308280924cc4"
  content_sha256: "d1430c8a295eabb2646d3fd7e7d7e506a197ffe48d7a482478f6243a45ac889c"
  files:
    - "Dockerfile"
    - "LICENSE"
    - "README.md"
    - "cmd/github-mcp-server/main.go"
    - "go.mod"
license: "MIT"
trust: "official"
reviewer:
  name: "Pandu maintainers"
  date: "2026-11-10"
  ci_passed: true
reviewed_on: "2026-11-10"
permissions:
  - id: "network"
    description: "Calls the GitHub API over HTTPS from the container."
  - id: "secrets"
    description: "Reads GITHUB_PERSONAL_ACCESS_TOKEN from the environment."
mcp:
  transport: "stdio"
  command: "docker"
  args:
    - "run"
    - "-i"
    - "--rm"
    - "-e"
    - "GITHUB_PERSONAL_ACCESS_TOKEN"
    - "ghcr.io/github/github-mcp-server@sha256:f6056fc10bfffcc8c81a6417a2e9ca12808647e8dd6049642a4feaadee0e0f8a"
  secrets:
    - "GITHUB_PERSONAL_ACCESS_TOKEN"
  install:
    - agent: "claude-code"
      scopes:
        - "user"
        - "project"
    - agent: "codex"
      scopes:
        - "user"
        - "project"
    - agent: "opencode"
      scopes:
        - "user"
        - "project"
readme: |
  # GitHub MCP Server (Docker)

  Runs GitHub's MCP server locally in a Docker container. The image is pinned by digest to the v2.1.0 release, and the container reads GITHUB_PERSONAL_ACCESS_TOKEN from its environment.

  Docker must be installed and running. Pandu asks for the token at install time and writes it to the agent configuration; it never stores the token in the registry or the install manifest.

  ## Command

  docker run -i --rm -e GITHUB_PERSONAL_ACCESS_TOKEN ghcr.io/github/github-mcp-server@sha256:f6056fc10bfffcc8c81a6417a2e9ca12808647e8dd6049642a4feaadee0e0f8a

  ## Source and license

  Source: https://github.com/github/github-mcp-server at commit 4bcdcdf8d7beee98c9448e73e257308280924cc4. License evidence and the pinned tree hash are recorded in the registry entry and the seed report.

  The repository LICENSE is MIT. Pandu records the source tree hash and license evidence in the entry.
