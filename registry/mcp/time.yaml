readme: |
  # Time

  An MCP server for current time and timezone conversion. It exposes get_current_time, convert_time, and get_time_ago. Timezone names must be exact IANA keys, and an ambiguous local time is reported rather than guessed.

  The server does not read files, call the network, or store anything on disk.

  ## Command

  uvx mcp-server-time==2026.11.4

  Pandu writes this command to the agent configuration. The agent runs it when it starts the server.

  ## Source and license

  Source: https://github.com/modelcontextprotocol/servers at commit 36380287ed3b15d115b55f546617d723072b1296. License evidence and the pinned tree hash are recorded in the registry entry and the seed report.

  The pyproject.toml declares the MIT license. Pandu records the source tree hash and license evidence in the entry.
