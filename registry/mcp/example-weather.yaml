short_description: A read-only example MCP server that returns current conditions and a short forecast.
long_description: >-
  An example fixture that shows the MCP entry shape, a pinned package version,
  required environment variable names, and a secret Cockpit asks for locally.
  The package name is illustrative and is not published. Cockpit writes the
  agent configuration only; the agent runs the command when it starts.
categories:
