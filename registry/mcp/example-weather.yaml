      scopes:
        - user
        - project
readme: |
  # Weather MCP

  **This is an example fixture.** It is hidden from production builds and is
  not a real marketplace listing.

  The server would expose two read-only tools:

  - `current_conditions` for a city.
  - `short_forecast` for the next few hours.

  ## Configuration

  - `WEATHER_UNITS` selects metric or imperial output. Set it in the agent's
    environment before the agent starts.
  - `WEATHER_API_KEY` is a secret. Cockpit asks for it locally at install time
    and never stores it in the registry, the database, or the install manifest.

  ## Command

  ```text
  npx -y example-weather-mcp@1.0.0
  ```

  The agent will run this command when it starts the server. Cockpit writes
  configuration only and never executes the command itself.
