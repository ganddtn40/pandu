readme: |
  # Sequential Thinking

  An MCP server with one tool, sequentialthinking. The model records each step, can revise an earlier thought, branch from a step, and change the estimated total number of thoughts as the problem develops.

  The server keeps thought history for the life of the connection. It does not read files, call the network, or store anything on disk.

  ## Command

  npx -y @modelcontextprotocol/server-sequential-thinking@2.1.1

  Pandu writes this command to the agent configuration. The agent runs it when it starts the server.

  ## Source and license

  Source: https://github.com/modelcontextprotocol/servers at commit 36380287ed3b15d115b55f546617d723072b1296. License evidence and the pinned tree hash are recorded in the registry entry and the seed report.

  The server README states the MIT license. Pandu records the source tree hash and license evidence in the entry.
