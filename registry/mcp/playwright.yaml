readme: |
  # Playwright MCP

  An MCP server that drives a real browser with Playwright. It exposes tools for navigation, clicking, typing, form filling, page snapshots, screenshots, console logs, and network inspection.

  The server launches a browser when the agent starts it. The Playwright browser binaries must already be installed on the machine. The package is pinned to 0.0.85.

  ## Command

  npx -y @playwright/mcp@0.0.85

  Pandu writes this command to the agent configuration. The agent runs it when it starts the server.

  ## Source and license

  Source: https://github.com/microsoft/playwright-mcp at commit 4e0794dd0a0176519830a5ed27b491137cf9338f. License evidence and the pinned tree hash are recorded in the registry entry and the seed report.

  The repository LICENSE is Apache-2.0. Pandu records the source tree hash and license evidence in the entry.
